<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Dashboard</title>
<!-- 图标就是热力图本身：Claude 橙底 + 深浅白格。内联 SVG，不引外部资源；
     16px 下格子仍分得清，比通用图表 emoji 更认得出是这个看板 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3.6' fill='%23d97757'/><g fill='%23fff'><rect x='2.3' y='3.8' width='2.4' height='2.4' rx='.6' opacity='.30'/><rect x='5.3' y='3.8' width='2.4' height='2.4' rx='.6' opacity='.95'/><rect x='8.3' y='3.8' width='2.4' height='2.4' rx='.6' opacity='.55'/><rect x='11.3' y='3.8' width='2.4' height='2.4' rx='.6' opacity='.25'/><rect x='2.3' y='6.8' width='2.4' height='2.4' rx='.6' opacity='.50'/><rect x='5.3' y='6.8' width='2.4' height='2.4' rx='.6' opacity='.75'/><rect x='8.3' y='6.8' width='2.4' height='2.4' rx='.6' opacity='1'/><rect x='11.3' y='6.8' width='2.4' height='2.4' rx='.6' opacity='.40'/><rect x='2.3' y='9.8' width='2.4' height='2.4' rx='.6' opacity='.25'/><rect x='5.3' y='9.8' width='2.4' height='2.4' rx='.6' opacity='.45'/><rect x='8.3' y='9.8' width='2.4' height='2.4' rx='.6' opacity='.70'/><rect x='11.3' y='9.8' width='2.4' height='2.4' rx='.6' opacity='.90'/></g></svg>">
<style>
:root {
  /* Anthropic 风：暖米白底 + 近黑正文 + 暖灰次要文字 + 品牌橙点缀。
     编辑排版质感，阴影收窄到几乎没有，靠留白和细线分层 */
  --bg: #faf9f5;
  --panel: #f4f2ec;
  --border: #e3dfd6;
  --text: #141413;
  --muted: #73726c;
  --faint: #ece9e1;
  --empty: #e2ddd2;
  --accent: #d97757;
  --shadow: 0 1px 2px rgba(20,20,19,.04);
  --radius: 12px;
  --pad: 16px;
  /* 标题衬线栈：编辑感的来源。正文/数字仍用 sans 保证可读 */
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia,
           "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    /* 对应的暖黑，不是纯黑 */
    --bg: #191817;
    --panel: #201f1d;
    --border: #35322e;
    --text: #f0eee9;
    --muted: #9b988f;
    --faint: #272522;
    --empty: #37332d;
    --accent: #e0855f;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro SC", "SF Pro Text",
        "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;              /* 一屏到底，不留滚动条 */
}

/* ---------- 骨架：整屏三段（顶栏 / 主区 / 无） ---------- */
.app {
  height: 100vh; height: 100dvh;
  display: flex; flex-direction: column;
  gap: 12px; padding: 14px 18px 16px;
}
.stage {
  flex: 1; min-height: 0;        /* min-height:0 是 flex 子项能收缩的前提 */
  display: grid;
  grid-template-columns: minmax(0, 62fr) minmax(0, 38fr);
  gap: 14px;
}
.side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
/* 侧栏两块面板平分剩余高度：高度必须由布局决定，否则「几行放得下」
   会依赖内容本身，形成先有鸡还是先有蛋 */
.side > .panel { flex: 1; }

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px var(--pad);
  box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  min-height: 0;
}

/* ---------- 顶栏 ---------- */
.topbar { display: flex; align-items: baseline; gap: 16px; flex: none; }
/* 大标题用衬线细字重，是这套风格的标志 */
h1 { font-family: var(--serif); font-size: 26px; font-weight: 400;
     letter-spacing: -.01em; margin: 0; white-space: nowrap; }
.topbar .total { font-size: 12px; color: var(--muted); white-space: nowrap; }
.topbar .total b { color: var(--text); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.topbar .spacer { flex: 1; }
.sync { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sync b { color: var(--text); font-weight: 500; }

.btn {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  font: inherit; font-size: 12px; color: var(--text);
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 12px; cursor: pointer;
  transition: background .15s, border-color .15s, opacity .15s;
}
.btn:hover:not(:disabled) { background: var(--faint); border-color: var(--muted); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.icon { padding: 6px 9px; }
.btn.spin svg { animation: spin .8s linear infinite; }
.btn.ok { color: #12833a; border-color: #12833a55; }
.btn.warn { color: #b25000; border-color: #b2500055; }
@media (prefers-color-scheme: dark) {
  .btn.ok { color: #4ad07a; } .btn.warn { color: #ffa250; }
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .btn.spin svg { animation: none; } }
.btn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- 分段控件 ---------- */
.seg { display: inline-flex; background: var(--faint); border-radius: 8px; padding: 2px; }
.seg button {
  border: 0; background: transparent; color: var(--muted); cursor: pointer;
  font: inherit; font-size: 12px; padding: 4px 11px; border-radius: 6px;
  transition: color .15s, background .15s;
}
.seg button[aria-pressed="true"] {
  background: var(--panel); color: var(--text); font-weight: 500;
  box-shadow: 0 1px 2px rgba(0,0,0,.08);
}

.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; flex: none; margin-bottom: 10px;
}
.panel-head h2 { font-family: var(--serif); font-size: 16px; font-weight: 500; margin: 0; letter-spacing: 0; }
.panel-head .note { color: var(--muted); font-size: 11px; }
/* 合计卡：像 Daily/Weekly 那种带底色圆角的小块。
   两行布局——主数字大字在上、副三项小字在下，纵向叠比横排窄很多，给右侧分段控件留空间。
   统计窗口（如 2026-08-19）移到整卡 hover，默认不占视觉位。 */
.metrics { display: inline-flex; align-items: baseline; gap: 8px;
  background: var(--faint); border-radius: 8px; padding: 4px 10px;
  font-variant-numeric: tabular-nums; white-space: nowrap; }
.metrics .big { color: var(--text); font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
.metrics .big .lab { color: var(--muted); font-size: 10.5px; font-weight: 500; margin-left: 2px; }
.metrics .sub { color: var(--muted); font-size: 10.5px; }
.metrics .sub b { color: var(--text); font-weight: 600; font-size: 11px; }

/* ---------- 左：日历 ---------- */
.cal-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
/* 月份轴在每个槽位内部（标题之下、格子之上），列宽与格子完全一致（repeat(N, CELL)），
   标签打在包含每月 1 号的那一周列上。注意类名不能再用 mtrack——排行条的 .mtrack
   是 flex，同名会把这个 grid 顶掉（2026-08 踩过） */
.months {
  display: flex; gap: 24px;
  font-size: 10.5px; color: var(--muted); height: 15px; line-height: 15px;
  flex: none; margin-bottom: 4px;
}
.maxis { display: grid; grid-auto-flow: column; gap: 3px; }
.maxis span { white-space: nowrap; overflow: visible; }

.cal-stack { flex: 1; min-height: 0; display: flex; flex-direction: column; }
/* 一行 1~2 个槽位（来源），槽位并排、同宽，格子尺寸全表统一 */
.cal-row { display: flex; gap: 24px; flex: 1; min-height: 0; align-items: flex-start; }
.cal-slot { display: flex; flex-direction: column; min-height: 0; flex: none; }
.cal-title {
  display: flex; align-items: center; gap: 8px; font-size: 13px;
  font-weight: 600; height: 24px; flex: none; white-space: nowrap;
}
.cal-title .pname { flex: none; }
/* 窗口大数字与副信息上提到行标题：口径跟随 activeWindow()，与排行、合计一致 */
.cal-title .win { font-size: 15px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; flex: none; }
.cal-title .winsub { font-size: 10px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums;
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
/* 标题右端：ccs 可用模型 logo（fill 写死品牌色）+ 范围总量小字 + 额度。
   min-width:0 + overflow:hidden 兜底：窄屏截断右端，绝不让内容溢出压到格子 */
.cal-title .tr { margin-left: auto; display: flex; align-items: center; gap: 8px;
                 min-width: 0; overflow: hidden; }
.cal-title .tr .models { display: flex; align-items: center; gap: 4px; flex: none; }
.cal-title .tr .models .mlogo { width: 15px; height: 15px; border-radius: 3px; display: block; object-fit: contain; }
.cal-title .range { color: var(--muted); font-weight: 400; font-size: 11px; white-space: nowrap; }
/* 窄屏按优先级丢信息：先丢副信息（hover 大数字还能看到），再丢范围总量小字 */
@media (max-width: 1250px) { .cal-title .winsub { display: none; } }
@media (max-width: 1100px) {
  .cal-title .range { display: none; }
  .qinline .qbar { width: 44px; }
}
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.picon { width: 18px; height: 18px; border-radius: 4px; display: inline-block; flex: none; object-fit: contain; }

.cal {
  display: grid; grid-auto-flow: column;
  grid-template-rows: repeat(7, var(--cell));
  grid-auto-columns: var(--cell);       /* 格子固定大小正方形，不拉伸；列数随槽位宽度 */
  justify-content: start;
  gap: var(--gap);
  flex: none;
}
.cal i {
  width: var(--cell); height: var(--cell);
  border-radius: max(2px, calc(var(--cell) / 4)); background: var(--empty);
  display: block; cursor: default;
}
.cal i[data-v]:hover, .cal i.col-hot { outline: 1.5px solid var(--text); outline-offset: 1px; }

/* 色阶缩略已按用户要求移除（2026-08：看格子本身就够直观，五行各一条太吵） */

/* 额度在格子下方一行排开（用户要求保留这种方式）：不换行，窄屏截断不挤压格子。
   额度是账号套餐的实时状态，不随 activeWindow() 变 */
.cal-foot { display: flex; align-items: center; gap: 12px; flex: none; margin-top: 5px;
            flex-wrap: nowrap; overflow: hidden; white-space: nowrap; }
.qinline { display: inline-flex; align-items: center; flex-wrap: nowrap;
           column-gap: 10px; row-gap: 1px;
           font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qinline .qprov { display: inline-flex; align-items: center; gap: 6px; }
.qinline .qp { font-weight: 600; }
.qinline .qsep { color: var(--border); }
.qinline .qgrp { display: inline-flex; align-items: center; gap: 4px; }
.qinline .qbar { width: 64px; height: 5px; border-radius: 3px; background: var(--faint); overflow: hidden; flex: none; }
.qinline .qbar i { display: block; height: 100%; border-radius: 3px; }
.qinline .qn { font-weight: 600; }
.qinline .qerr { font-style: italic; }
/* ccs 两家供应商四个窗口一行排开：供应商名粗体在前，5h/周进度条紧随其后 */
.qinline-ccs { column-gap: 8px; }
.qinline-ccs .qp { margin-right: -4px; }

/* ---------- 右：排行表 ---------- */
/* 放不下就滚动，不再按高度裁行数——裁掉的长尾用户根本看不到 */
.rank { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 7px;
        overflow-y: auto; overflow-x: hidden; padding-right: 4px; }
.rank::-webkit-scrollbar { width: 6px; }
.rank::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.rank::-webkit-scrollbar-thumb:hover { background: var(--muted); }
.rank { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

.rank-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; flex: none; }
.rank-name { font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-val { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
/* 堆叠条：整条长度 = 相对榜首的占比，段长 = 该来源在这一项里的占比。
   8px 是能看清分段边界的下限，再粗列表就笨重了 */
.stack { grid-column: 1 / -1; display: flex; height: 8px; border-radius: 4px; overflow: hidden; min-width: 4px; }
/* 占比极小的段（实测有 0.1px 的）既看不见也悬停不到，给个最低可见宽度；
   flex-shrink 会把这点宽度从其他段按比例匀出来，总长仍然准确 */
.stack span { display: block; height: 100%; cursor: default; min-width: 3px; }
.stack span:hover { filter: brightness(1.25); }
.empty { color: var(--muted); font-size: 11.5px; padding: 4px 0; }

/* ---------- 按模型：品牌条 ----------
   logo 在条前，条加高到 20px。条内放得下名字就白字放条内；
   条太短放不下时，名字放条外右侧用普通文字色，保证短条也可读。 */
.mrow { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; flex: none; }
.mrow.no-logo { grid-template-columns: 1fr auto; }
.mrow .mlogo { width: 15px; height: 15px; border-radius: 3px; display: block; object-fit: contain; }
.mtrack { display: flex; align-items: center; min-width: 0; position: relative; }
.mbar { height: 20px; border-radius: 6px; display: flex; align-items: center;
        padding: 0 8px; box-sizing: border-box; min-width: 2px; flex: none; }
.mbar span { color: #fff; font-size: 11px; font-weight: 500; line-height: 1;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mbar:hover { filter: brightness(1.08); }
.mname-out { font-size: 11.5px; color: var(--text); margin-left: 7px;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 按项目用分段堆叠条恢复各模型分布：条长 = 占榜首比例，段长 = 该模型在此项中的占比。
   名字浮层绝对定位在条上居左，条太短时改放条外。条高 20px 与按模型齐平。 */
.mtrack .stack { grid-column: auto; height: 20px; border-radius: 6px;
                 flex: none; min-width: 2px; }
.mtrack .stack span { min-width: 0; }
.mname-in  { position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
             color: #fff; font-size: 11px; font-weight: 500; line-height: 1;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
             pointer-events: none; }

/* 排行面板头部的 列表/占比 切换：复用 .seg 样式，只做小号版 */
.rank-toggle { padding: 1px; }
.rank-toggle button { font-size: 10.5px; padding: 2px 8px; }

/* ---------- 占比饼图 ---------- */
/* 单个大饼居中：名字直标在扇区里，具体占比看 hover，不再要图例 */
.pie-wrap { display: flex; align-items: center; justify-content: center;
            min-height: 0; flex: 1; }
.pie-wrap svg { flex: none; display: block; }
.pie-label { fill: #fff; font-size: 12px; font-weight: 600; text-anchor: middle;
             dominant-baseline: central; pointer-events: none; }
.pie-wrap path:hover, .pie-wrap circle:hover { filter: brightness(1.12); }

/* ---------- 浮层 ---------- */
#tip {
  position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
  background: rgba(28,28,30,.95); color: #fff; font-size: 12px; line-height: 1.55;
  padding: 7px 10px; border-radius: 7px; z-index: 50; white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0,0,0,.2);
}
#tip b { font-weight: 600; }
#tip .sm { color: rgba(255,255,255,.65); }

#info {
  position: fixed; right: 18px; top: 52px; z-index: 60; width: min(520px, calc(100vw - 36px));
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 8px 40px rgba(0,0,0,.18); padding: 14px 16px;
  font-size: 12px; line-height: 1.65; color: var(--muted);
}
#info[hidden] { display: none; }
#info b { color: var(--text); }
#info div + div { margin-top: 6px; }
code { background: var(--faint); padding: 1px 5px; border-radius: 4px; font-size: 11px; color: var(--text); }

/* ---------- 长区间全屏遮罩 ----------
   主屏只放 3 个月；半年/一年在这里占满整个视口，格子比挤在左栏时大得多 */
#longview {
  position: fixed; inset: 0; z-index: 70; background: var(--bg);
  padding: 18px 22px; display: flex; flex-direction: column;
}
#longview[hidden] { display: none; }
.lv-panel { flex: 1; min-height: 0; display: flex; flex-direction: column;
            max-width: 1500px; width: 100%; margin: 0 auto; }
#lv-close { margin-left: auto; }

@media (max-width: 940px) {
  .stage { grid-template-columns: 1fr; }
  body { overflow: auto; }
  .app { height: auto; min-height: 100vh; }
  /* 单栏模式下日历槽位纵向堆叠（槽宽 JS 侧已按整宽算） */
  .cal-row { flex-direction: column; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>Token Activity</h1>
    <span class="total" id="total"></span>
    <span class="spacer"></span>
    <span class="sync" id="sync"></span>
    <button class="btn" id="refresh">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
        <path d="M13.6 8a5.6 5.6 0 1 1-1.7-4" fill="none" stroke="currentColor"
              stroke-width="1.7" stroke-linecap="round"/>
        <path d="M13.4 1.2v3.1h-3.1" fill="none" stroke="currentColor"
              stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span id="refresh-text">Refresh</span>
    </button>
    <button class="btn icon" id="info-btn" aria-label="Methodology" title="Methodology">ⓘ</button>
  </header>

  <div class="stage">
    <section class="panel">
      <div class="panel-head">
        <div class="seg" id="view-seg">
          <button data-view="daily" aria-pressed="true">Daily</button>
          <button data-view="weekly" aria-pressed="false">Weekly</button>
          <button data-view="cumulative" aria-pressed="false">Cumulative</button>
        </div>
        <span class="note" id="scale-note"></span>
        <div class="metrics" id="metrics" title=""></div>
        <button class="btn" id="longview-btn" title="打开半年 / 一年长区间视图">6 mo / 1 yr ▸</button>
      </div>
      <div class="cal-wrap" id="view"></div>
    </section>

    <aside class="side">
      <section class="panel">
        <div class="panel-head">
          <h2>By Model</h2>
          <span style="display:inline-flex;align-items:center;gap:8px">
            <span class="note" id="models-scope"></span>
            <span class="seg rank-toggle" id="models-toggle">
              <button data-mode="list" aria-pressed="true">List</button>
              <button data-mode="pie" aria-pressed="false">Share</button>
            </span>
          </span>
        </div>
        <div class="rank" id="models"></div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <h2>By Project</h2>
          <span style="display:inline-flex;align-items:center;gap:8px">
            <span class="note" id="projects-scope"></span>
            <span class="seg rank-toggle" id="projects-toggle">
              <button data-mode="list" aria-pressed="true">List</button>
              <button data-mode="pie" aria-pressed="false">Share</button>
            </span>
          </span>
        </div>
        <div class="rank" id="projects"></div>
      </section>
    </aside>
  </div>
</div>

<div id="tip"></div>
<div id="info" hidden></div>

<!-- 长区间全屏遮罩：主屏只放 3 个月，半年/一年在这里用整个屏幕的宽高画 -->
<div id="longview" hidden>
  <section class="panel lv-panel">
    <div class="panel-head">
      <div class="seg" id="lv-view-seg">
        <button data-view="daily" aria-pressed="true">Daily</button>
        <button data-view="weekly" aria-pressed="false">Weekly</button>

<script>
let DATA = /*__DATA__*/null;

// cco 用 Claude 品牌橙；ccs 虽然也是 Claude Code，但跑第三方模型，用紫区分；
// grok 让出橙色改中性灰；kimi 用 Kimi 品牌蓝（与 MODEL_COLORS.kimi 同源，AA 口径）；
// codex 用 OpenAI 品牌黑（AA 主题色 #1f1f1f；深色主题下纯黑会糊进底色，反为近白）
// 2026-08 改暖色底后，各品牌色统一压了一点饱和度/偏暖，避免在米白底上发荧光；
// 色相不动，保证一眼还能认出是哪家
const COLORS = { cco: '#d97757', ccs: '#7a55c8', grok: '#7a7268', kimi: '#047afe', codex: '#1f1f1f' };
if (matchMedia('(prefers-color-scheme: dark)').matches) COLORS.codex = '#e8e6e1';
/* 模型品牌色，与 artificialanalysis.ai 模型页各家主题色一致
   （Kimi #047AFE / MiniMax #EB3568 / Z.ai #1C7FF8），按模型排行与模型 logo 同源。 */
const MODEL_COLORS = { kimi: '#047afe', minimax: '#eb3568', glm: '#1c7ff8' };
function modelColor(profile, model) {
  if (profile !== 'ccs' || !model) return COLORS[profile];
  const m = model.toLowerCase();
  if (m.startsWith('glm')) return MODEL_COLORS.glm;
  if (m.startsWith('minimax') || m.includes('mmx')) return MODEL_COLORS.minimax;
  if (m === 'k3' || m.startsWith('kimi') || m.startsWith('moonshot')) return MODEL_COLORS.kimi;
  return COLORS[profile];
}
/* 排行面板的大块填充（条 / 堆叠段 / 饼图扇区）不用满饱和原色：向面板底色混 15%，

   明暗两个主题各自适配。logo 等小面积点缀仍用原色，保证辨识度。 */

   grok 系用 grok 标，三家 cc-switch 模型用各自的品牌标 */
function modelLogo(profile, model) {

  if (m.startsWith('glm')) return MODEL_LOGOS.glm;
  if (m.startsWith('minimax') || m.includes('mmx')) return MODEL_LOGOS.minimax;
  if (m === 'k3' || m.startsWith('kimi') || m.startsWith('moonshot')) return MODEL_LOGOS.kimi;

  return `<img class="mlogo" src="${LOGOS.cco}" alt="">`;
}
const DAY = 86400000;

/* ---------- 工具 ---------- */
const fmt = n => n.toLocaleString('en-US');
/* token 一律用 K/M/B：模型计价本来就是按 per-million 报的，M 和成本直觉同刻度，
   比数逗号快得多。全站共用一套单位，避免同页出现两种写法。 */
function human(n) {
  for (const [div, suffix] of [[1e9, 'B'], [1e6, 'M'], [1e3, 'K']]) {
    if (n >= div) {
      const v = n / div;
      return (v >= 10 ? v.toFixed(1) : v.toFixed(2)) + suffix;
    }
  }
  return String(Math.round(n));
}
// 紧凑数字（副指标用）：无小数，只够一眼看量级。比 human 短 1-2 字符，挤宽度用。
const hc = n => {
  for (const [div, suffix] of [[1e9, 'B'], [1e6, 'M'], [1e3, 'K']]) {
    if (n >= div) return Math.round(n / div) + suffix;
  }
  return String(Math.round(n));
};
const iso = d => {
  const t = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return t.toISOString().slice(0, 10);
};
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
function weekKey(dateStr) {
  const d = parse(dateStr);
  d.setDate(d.getDate() - d.getDay());
  return iso(d);
}

/* 分位数分档：token 分布跨几个数量级，线性着色会让绝大多数格子挤在最浅一档 */
function thresholds(values) {
  const v = values.filter(x => x > 0).sort((a, b) => a - b);
  if (!v.length) return [0, 0, 0, 0];
  const q = p => v[Math.min(v.length - 1, Math.floor(v.length * p))];
  return [q(0.25), q(0.5), q(0.75), q(0.92)];
}
function level(value, th) {
  if (value <= 0) return 0;
  let lv = 1;
  for (const t of th) if (value > t) lv++;
  return Math.min(lv, 5);
}
/* 单色顺序色阶：同一色相下按明度递进，色盲安全，明暗主题都可读 */
function shade(hex, lv) {
  if (lv === 0) return null;
  const alpha = [0, 0.18, 0.36, 0.58, 0.8, 1][lv];
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ---------- 数据整形 ---------- */
// 刷新会整体换掉 DATA，所以派生结构必须能重算，不能是顶层 const
let PROFILES = [], byProfile = {}, firstDate = null, lastDate = null;

function applyData(payload) {
  DATA = payload;
  // 目录不存在或没有任何记录的来源直接不画，避免出现一整行空白日历
  PROFILES = DATA.profiles.filter(p => p.present && p.msgs > 0);
  byProfile = {};
  for (const p of PROFILES) byProfile[p.key] = {};
  for (const row of DATA.daily) {
    if (byProfile[row.profile]) byProfile[row.profile][row.date] = row;
  }
  const allDates = DATA.daily.map(r => r.date).sort();
  firstDate = allDates[0];
  lastDate = allDates[allDates.length - 1];
}

// 主屏固定 3 个月；半年/一年在长区间遮罩里看（lvState）
let state = { view: 'daily', weeks: 13 };
let lvState = { view: 'daily', weeks: 26 };

/* ---------- 顶栏与窗口总量 ----------
   行标题大数字和右侧排行共用 activeWindow()：切到「每日」时排行只剩今天，
   行标题若还停在全期总量，同一屏上两个数字就对不上。
   view/weeks 可显式传入（长区间遮罩用自己的 lvState 渲染，不动主屏 state）。 */
function windowTotals(view = state.view, weeks = state.weeks) {
  const win = activeWindow(view, weeks);
  const acc = {};
  for (const p of PROFILES) {
    acc[p.key] = { incr: 0, cache_read: 0, input: 0, msgs: 0, reasoning: 0, cost_ticks: 0 };
  }
  for (const r of DATA.daily) {
    const a = acc[r.profile];
    if (!a || !win.test(r.date)) continue;
    a.incr += r.incr;
    a.cache_read += r.cache_read;
    a.input += r.input || 0;
    a.msgs += r.msgs;
    a.reasoning += r.reasoning || 0;
    a.cost_ticks += r.cost_ticks || 0;
  }
  return { win, acc };
}

/* ---------- 行尾额度区 ----------
   额度是账号实时状态，不随 activeWindow() 变——这是它有别于行标题大数字的根本点。
   数据来自后端 QuotaPoller（DATA.quota），静态生成的 HTML 没有这个键，直接不画。 */
function pctColor(pct) {
  return pct >= 90 ? '#e5484d' : pct >= 70 ? '#d4a000' : pct >= 50 ? '#e8930c' : '#2c9e4f';
}

function fmtReset(iso, style) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2, '0'), ap = h >= 12 ? 'pm' : 'am';
  const hm = `${h % 12 || 12}:${m}${ap}`;
  if (style === 'time') return hm;
  // 周重置：日期+时刻。接口返回的是完整时间戳，只显示日期会丢掉「几点重置」
  if (style === 'datetime') return `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

function quotaGroup(key, w, showReset, stale, color) {
  const pct = Math.max(0, Math.min(100, w.pct || 0));
  const weekly = w.key !== '5h';
  const resetIso = w.reset || (w.reset_ms ? new Date(w.reset_ms).toISOString() : '');
  const reset = fmtReset(resetIso, weekly ? 'datetime' : 'time');
  const tip = (reset ? `↻ resets ${reset}` : 'no reset time') + (stale ? ' · query failed, showing last data' : '');
  return `<span class="qgrp${weekly ? ' qgrp-w' : ''}" title="${tip}">
    <span class="qw">${weekly ? 'wk' : '5h'}</span>
    <span class="qbar"><i style="width:${pct}%;background:${color || COLORS[key]}"></i></span>
    <span class="qn" style="color:${pctColor(pct)}">${pct}%</span>
    ${showReset && reset ? `<span class="qr">↻${reset}</span>` : ''}
  </span>`;
}

/* MiniMax 品牌色：官方 logo 是品红→橙渐变，取品红端压饱和后的 #cf3d7a 作为代表色，
   与 cco 橙、ccs 紫都能拉开，且在暖底上不发荧光 */
const MMX_COLOR = '#cf3d7a';

/* 行尾额度一行排开：cco/grok 窗口少，重置时间内联；ccs 两家四个窗口太长，
   供应商名在每组最前，重置时间收进 tooltip */
function quotaInline(key) {
  // codex 的额度来自会话文件里的 rate_limits（collect 时随 meta 下发），
  // 不联网、静态模式也有；其余来源走后端 QuotaPoller（DATA.quota）
  if (key === 'codex') {
    const p = (DATA.profiles || []).find(x => x.key === 'codex');
    const q = p && p.quota;
    if (!q) return '';
    const out = q.windows.map(w => quotaGroup(key, w, true, false)).join('');
    return out ? `<span class="qinline"${q.plan ? ` title="plan: ${q.plan}"` : ''}>${out}</span>` : '';
  }
  const Q = DATA.quota;
  if (!Q) return '';
  let out = '';
  if (key === 'cco' && Q.cco) {
    out = Q.cco.windows.map(w => quotaGroup(key, w, true, false)).join('');
  } else if (key === 'kimi' && Q.kimi) {
    // kimi code 官方账号额度（CLI 的 OAuth 凭证轮询 /v1/usages），同 cco 处理
    out = Q.kimi.windows.map(w => quotaGroup(key, w, true, false)).join('');
  } else if (key === 'grok' && Q.grok) {
    // grok 只有周额度一个窗口（CLI 内部 billing 接口），同 cco 处理
    out = Q.grok.windows.map(w => quotaGroup(key, w, true, false)).join('');
  } else if (key === 'ccs' && Q.ccs) {
    // Kimi 的额度条已挪到 kimi code 行（同一账号），ccs 这里只剩 MiniMax。
    // 一行排开不换行（用户明确要求）：供应商名在前，5h/周两组窗口紧随其后。
    const cells = [];
    Q.ccs.providers.forEach(prov => {
      const isMmx = /^minimax$/i.test(prov.name);
      const short = isMmx ? 'Minimax' : prov.name.replace(/\s*For Coding\s*/i, '');
      const color = isMmx ? MMX_COLOR : null;
      if (prov.error && !prov.windows.length) {
        cells.push(`<span class="qp" title="${prov.error}">${short}</span>`, `<span class="qerr">${prov.error}</span>`);
      } else {
        cells.push(`<span class="qp" title="${prov.error || ''}">${short}</span>`);
        prov.windows.forEach(w => cells.push(quotaGroup(key, w, true, prov.stale, color)));
      }
    });
    return `<span class="qinline qinline-ccs">${cells.join('')}</span>`;
  }
  return out ? `<span class="qinline">${out}</span>` : '';
}

/* 窗口副信息：cache 读量 · 调用次数×，再挂推理/名义金额（grok）。
   行标题大数字旁与 tooltip 共用这一套，保证同一窗口下各处数字一致 */
function winSub(d) {
  const extra = [];
  if (d.reasoning) extra.push(`reason ${human(d.reasoning)}`);
  // ticks 单位按 1e-9 USD 推定；grok 是订阅登录，这只是名义价值
  if (d.cost_ticks) {
    const usd = d.cost_ticks / 1e9;
    // 单日窗口下金额常常不足 $1，取整会全变成 $0
    extra.push(`≈$${usd.toFixed(usd >= 10 ? 0 : 2)}`);
  }
  // 缓存命中率 = cache_read / (cache_read + 非缓存输入)，即输入侧 token 有多大比例直接命中缓存。
  // 输入侧完全没有流量（cache_read 和 input 都为 0）时分母为 0，不显示，避免误导成 0%。
  const read = d.cache_read || 0, fresh = d.input || 0;
  if (read + fresh > 0) extra.unshift(`hit ${(read / (read + fresh) * 100).toFixed(0)}%`);
  return `cache ${human(d.cache_read)} · ${fmt(d.msgs)}×${extra.length ? ' · ' + extra.join(' · ') : ''}`;
}

function renderMeta() {
  const { win, acc } = windowTotals();

  // 顶栏固定给全期总账，作为不随 tab 变动的锚点
  const lifeIncr = PROFILES.reduce((s, p) => s + p.incr, 0);
  const lifeRead = PROFILES.reduce((s, p) => s + p.cache_read, 0);
  document.getElementById('total').innerHTML =
    `lifetime <b>${human(lifeIncr)}</b> · cache read ${human(lifeRead)} · ${firstDate} → ${lastDate}`;

  const totalIncr = PROFILES.reduce((s, p) => s + acc[p.key].incr, 0);
  const totalDup = PROFILES.reduce((s, p) => s + p.deduped, 0);
  const totalRead = PROFILES.reduce((s, p) => s + acc[p.key].cache_read, 0);
  const totalInput = PROFILES.reduce((s, p) => s + acc[p.key].input, 0);
  const totalMsgs = PROFILES.reduce((s, p) => s + acc[p.key].msgs, 0);
  // 缓存命中率 = cache_read / (cache_read + 非缓存输入)；无输入流量时留空
  const denom = totalRead + totalInput;
  const hit = denom > 0 ? (totalRead / denom * 100).toFixed(0) + '%' : '—';
  // 次数单位：calls；数字大了用 K
  const calls = totalMsgs >= 1000 ? (totalMsgs / 1000).toFixed(1) + 'K' : fmt(totalMsgs);
  // 合计卡：只留总 token + 调用次数两项，缓存量和命中率塞进 hover（自定义 tooltip）
  const metrics = document.getElementById('metrics');
  metrics.innerHTML =
    `<span class="big">${human(totalIncr)}<span class="lab">total</span></span>`
    + `<span class="sub"><b>${calls}</b> calls</span>`;
  // hover 数据：缓存读、命中率、统计窗口、精确值——供 mouseover 的 .metrics 分支用
  metrics.dataset.read = totalRead;
  metrics.dataset.hit = hit;
  metrics.dataset.win = win.label;
  metrics.dataset.ti = fmt(totalIncr);
  metrics.dataset.tr = fmt(totalRead);
  metrics.dataset.tm = fmt(totalMsgs);
}

/* ---------- 左：日历 ----------
   三行分组布局：cco 独自一行（主力工具）；codex+grok（次级工具）；
   ccs+kimi（同一个 k3 的迁移前后，并排正好对照）。每个来源占一个槽位，
   一行 1~2 个槽位并排。格子是固定大小的正方形、绝不拉伸（用户明确要求），
   列数随槽位宽度能放几列放几列（一列 = 一周）——独占行天然多放几列、
   多显示几周历史。月份轴在每个槽位内部，按自己的列几何对齐。
   主屏与长区间遮罩共用，box 各自传入；weeks 是列数上限（遮罩的 6mo/1yr）。 */
const ROW_LAYOUT = [['cco'], ['codex', 'grok'], ['ccs', 'kimi']];
const SLOT_GAP = 24;
const CELL = 17;   // 格子边长固定（分支开始时 1920×1080 下的大小）

function renderCalendar(boxId, view, weeks) {
  const box = document.getElementById(boxId);
  const weekly = view === 'weekly';
  const cumulative = view === 'cumulative';
  const { acc } = windowTotals(view, weeks);
  const end = parse(lastDate);

  // 不存在的来源（目录缺失/无记录）从布局剔除；整行为空则整行去掉
  const layout = ROW_LAYOUT.map(keys => keys.filter(k => byProfile[k])).filter(r => r.length);
  if (!layout.length) { box.innerHTML = ''; return; }
  // 槽宽按行算：独占一行的用整宽，双槽位行各半；
  // 窄屏单栏模式下槽位纵向堆叠（见 940px 媒体查询），一律整宽
  const narrow = matchMedia('(max-width: 940px)').matches;
  const rowSlotW = n => (narrow || n === 1) ? box.clientWidth : (box.clientWidth - SLOT_GAP) / 2;
  // 槽位放得下的列数（一列 = 一周）。主屏不设上限：能放几列放几列，多放就是
  // 多显示几周历史（用户明确要求）；遮罩里受 weeks 约束（6mo/1yr 是显式选择）
  const colCap = boxId === 'view' ? 999 : weeks;
  const colsFor = w => Math.max(4, Math.min(colCap, Math.floor((w + GAP) / (CELL + GAP))));

  const P = Object.fromEntries(PROFILES.map(p => [p.key, p]));
  const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // 单个槽位（一个来源）：标题行 + 月份轴 + 格子 + 额度行（格子下方一行排开、不换行）
  const slotHtml = (key, w) => {
    const p = P[key];
    const map = byProfile[key];
    const cols = colsFor(w);
    // 起点 = end 所在周往前 cols-1 周，再对齐到周日 → 恰好 cols 列
    const start = new Date(end.getTime());
    start.setDate(start.getDate() - (cols - 1) * 7);
    start.setDate(start.getDate() - start.getDay());

    // 每周模式：把日聚合成周，整列共用同一个值
    let bucket = map, keyOf = k => k;
    if (weekly) {
      bucket = {};
      for (const [date, row] of Object.entries(map)) {
        const wk = weekKey(date);
        const b = bucket[wk] || (bucket[wk] = { incr: 0, cache_read: 0, msgs: 0 });
        b.incr += row.incr;
        b.cache_read += row.cache_read;
        b.msgs += row.msgs;
      }
      keyOf = weekKey;
    }
    // 累计视图格子仍按当日增量着色：累计值单调递增，按它着色是一条
    // 越来越深的渐变带，没有信息量；累计值挪进 hover tooltip
    const th = thresholds(Object.values(bucket).map(r => r.incr));

    const cells = [];
    let colIndex = -1, run = 0;
    for (let t = start.getTime(); t <= end.getTime(); t += DAY) {
      const d = new Date(t), dk = iso(d);   // dk：日期键，别盖住槽位的 profile key
      if (d.getDay() === 0) colIndex++;
      const row = bucket[keyOf(dk)];
      if (cumulative) run += row ? row.incr : 0;
      const lv = row ? level(row.incr, th) : 0;
      const bg = shade(COLORS[key], lv);
      const label = weekly ? `week of ${keyOf(dk)}` : dk;
      const cum = cumulative ? ` data-cum="${run}"` : '';
      const attrs = row
        ? ` data-v="1" data-col="${colIndex}" data-d="${label}" data-i="${row.incr}"`
          + ` data-c="${row.cache_read}" data-m="${row.msgs}" data-p="${p.label}"${cum}`
        : ` data-col="${colIndex}" data-d="${label}" data-p="${p.label}"${cum}`;
      cells.push(`<i style="${bg ? 'background:' + bg : ''}"${attrs}></i>`);
    }

    // 月份轴按本槽位的列几何：每列一个标签位，列宽与格子完全一致（固定 17px）。
    // 标签打在「包含每月 1 号」的那一列：用这一周最后一天（周六）的月份判定，
    // 否则用周日的月份会晚一格（比如 9/1 是周四时，标签会落到 9/4 那列）
    const monthCols = [];
    let lastMonth = -1;
    for (let t = start.getTime(); t <= end.getTime(); t += DAY) {
      const d = new Date(t);
      if (d.getDay() !== 0) continue;
      const m = new Date(Math.min(t + 6 * DAY, end.getTime())).getMonth();
      monthCols.push(m !== lastMonth ? (lastMonth = m, MN[m]) : '');
    }
    const monthsHtml = `<div class="months"><div class="maxis" style="grid-template-columns:repeat(${monthCols.length},${CELL}px)">`
      + monthCols.map(m => `<span>${m}</span>`).join('') + `</div></div>`;

    const unit = weekly ? Object.keys(bucket).length + ' wk'
                        : Object.values(map).filter(r => r.incr > 0).length + ' d';
    // 槽位标题：左端 logo + 名称 + 窗口大数字/副信息（口径与排行、合计一致）；
    // 右端 ccs 可用模型 logo + 范围总量小字。额度在格子下方的 cal-foot。
    const d = acc[key];
    const sub = winSub(d);
    const models = key === 'ccs'
      ? `<span class="models" title="Available models: MiniMax · GLM">`
        + MODEL_LOGOS.minimax + MODEL_LOGOS.glm + `</span>`
      : '';
    const quota = quotaInline(key);
    return `
      <div class="cal-slot" style="width:${w}px">
        <div class="cal-title">
          <img class="picon" src="${LOGOS[key]}" alt="">
          <span class="pname">${p.label}</span>
          <span class="win" title="${fmt(d.incr)} tokens · ${sub}">${human(d.incr)}</span>
          <span class="winsub" title="${sub}">${sub}</span>
          <span class="tr">${models}<span class="range">${unit} active · ${human(p.incr)}</span></span>
        </div>
        ${monthsHtml}
        <div class="cal${weekly ? ' by-week' : ''}">${cells.join('')}</div>
        ${quota ? `<div class="cal-foot">${quota}</div>` : ''}
      </div>`;
  };

  const rows = layout.map(keys => {
    const w = rowSlotW(keys.length);
    return `<div class="cal-row">${keys.map(k => slotHtml(k, w)).join('')}</div>`;
  }).join('');

  box.innerHTML = `
    <div class="cal-stack" style="--cell:${CELL}px;--gap:${GAP}px">${rows}</div>`;

  if (boxId === 'view') document.getElementById('scale-note').textContent = '';
}

/* ---------- 右：排行 ----------
   时间窗口跟随左侧视图：每日 = 最后一天，每周 = 最后一周，累计 = 整个范围。 */
function activeWindow(view = state.view, weeks = state.weeks) {
  if (view === 'daily') {
    return { test: d => d === lastDate, label: lastDate };
  }
  if (view === 'weekly') {
    const wk = weekKey(lastDate);
    return { test: d => weekKey(d) === wk, label: `week of ${wk}` };
  }
  const start = new Date(parse(lastDate).getTime() - (weeks * 7 - 1) * DAY);
  start.setDate(start.getDate() - start.getDay());
  const from = iso(start);
  const label = weeks >= 53 ? 'past 1 yr' : `past ${Math.round(weeks / 4.345)} mo`;
  return { test: d => d >= from && d <= lastDate, label };
}

// 每个排行面板各自的展示模式：list = 横向堆叠条，pie = 占比环形图
let rankMode = { models: 'list', projects: 'list' };

function renderRank(id, rows, nameKey) {
  const box = document.getElementById(id);
  const win = activeWindow();
  document.getElementById(id + '-scope').textContent = win.label;

  // 按名字分组，组内再按段拆开——同一个项目常常横跨多个渠道/模型，
  // 分开列成多行就看不出这个项目总共烧了多少。
  // 段的粒度两个面板不同：按模型的段 = 来源（取主来源的品牌色和 logo），
  // 按项目的段 = 模型（段色与按模型排行同源）；profiles 记录每个段来自哪个来源
  const groups = new Map();
  for (const r of rows) {
    if (r.incr <= 0 || !win.test(r.date)) continue;
    let g = groups.get(r[nameKey]);
    if (!g) groups.set(r[nameKey], g = { name: r[nameKey], total: 0, parts: {}, profiles: {} });
    g.total += r.incr;
    const pk = id === 'projects' ? r.model : r.profile;
    g.parts[pk] = (g.parts[pk] || 0) + r.incr;
    g.profiles[pk] = r.profile;
  }
  const list = [...groups.values()].sort((a, b) => b.total - a.total);

  if (!list.length) {
    box.innerHTML = `<div class="empty">No activity in this window</div>`;
    return;
  }
  if (rankMode[id] === 'pie') return renderPie(box, id, list);
  const max = list[0].total;

  // 排行宽带样式：条内放得下名字就白字放条内（居左），条太短时放条外。
  // 按模型：单色条（取该模型品牌色）+ 条前 logo；按项目：分段堆叠条，恢复各模型分布，
  // 段长 = 该模型在此项里的占比、段色与按模型排行同源。两种面板条高一致、名字规则一致。
  {
    const trackPx = 420; // 轨道近似宽度，用于估算名字放不放得下；差一点无碍，只是内/外之别
    const totalAll = list.reduce((s, x) => s + x.total, 0);
    box.innerHTML = list.map(g => {
      const dom = PROFILES.reduce((best, p) =>
        (g.parts[p.key] || 0) > (g.parts[best.key] || 0) ? p : best, PROFILES[0]).key;
      const w = g.total / max * 100;
      const needPx = g.name.length * 6.6 + 18; // 名字宽度 + 内边距
      const inside = (w / 100 * trackPx) >= needPx;
      if (id === 'models') {
        const bg = modelColor(dom, g.name);
        const logo = modelLogo(dom, g.name);
        return `
        <div class="mrow">
          ${logo}
          <div class="mtrack">
            <div class="mbar" style="width:${w.toFixed(1)}%;background:${soft(bg)}"
                 data-sn="${g.name}" data-sv="${g.total}"
                 data-sp="${(g.total / totalAll * 100).toFixed(0)}">
              ${inside ? `<span>${g.name}</span>` : ''}
            </div>
            ${inside ? '' : `<span class="mname-out">${g.name}</span>`}
          </div>
          <div class="rank-val">${human(g.total)}</div>
        </div>`;
      }
      // 按项目：分段堆叠，段 = 模型，段长按该模型在此项目中的占比，
      // 段色与按模型排行同源（modelColor）
      const parts = Object.entries(g.parts)
        .map(([m, v]) => ({ model: m, v, c: v / g.total * 100,
                            color: modelColor(g.profiles[m], m) }))
        .filter(p => p.v > 0)
        .sort((a, b) => b.v - a.v);
      const segs = parts.map(p => `
        <span style="width:${p.c.toFixed(2)}%;background:${soft(p.color)}"
              data-sn="${g.name}" data-seg="${p.model}"
              data-sv="${p.v}" data-sp="${(p.v / totalAll * 100).toFixed(0)}"></span>`).join('');
      return `
      <div class="mrow no-logo">
        <div class="mtrack">
          <div class="stack" style="width:${w.toFixed(1)}%">${segs}</div>
          ${inside ? `<span class="mname-in">${g.name}</span>` : `<span class="mname-out">${g.name}</span>`}
        </div>
        <div class="rank-val">${human(g.total)}</div>
      </div>`;
    }).join('');
    return;
  }
}

/* 占比饼图：实心扇区，每块直接标百分比；图例给名字和用量。
   颜色沿用堆叠条的规则——按模型取主来源下该模型的品牌色，按项目取用量最大
   模型段的品牌色，保证列表/占比两种看法同色系。 */
function renderPie(box, id, list) {
  const total = list.reduce((s, g) => s + g.total, 0);
  // 扇区颜色 = 这个名字里最大的一段的颜色
  const colorOf = g => {
    if (id === 'models') {
      const p = PROFILES.reduce((best, p) =>
        (g.parts[p.key] || 0) > (g.parts[best.key] || 0) ? p : best, PROFILES[0]);
      return modelColor(p.key, g.name);
    }
    // 按项目：段 = 模型，取用量最大的模型段的品牌色
    const m = Object.keys(g.parts).reduce((a, b) => g.parts[a] >= g.parts[b] ? a : b);
    return modelColor(g.profiles[m], m);
  };

  const CX = 110, CY = 110, R = 104;
  const pt = (ang, r) => [CX + r * Math.cos(ang), CY + r * Math.sin(ang)];
  let acc = -Math.PI / 2; // 从正上方开始，顺时针
  let slices = '', labels = '';
  for (const g of list) {
    const frac = g.total / total;
    const a0 = acc, a1 = acc + frac * 2 * Math.PI;
    acc = a1;
    const col = soft(colorOf(g));
    if (frac >= 0.9999) {
      // 单一项目占满整圆时弧线首尾重合画不出来，直接画个整圆
      slices += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="${col}"
        data-sn="${g.name}" data-sv="${g.total}" data-sp="100.0"/>`;
    } else {
      const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R);
      const large = frac > 0.5 ? 1 : 0;
      slices += `<path d="M${CX},${CY} L${x0.toFixed(2)},${y0.toFixed(2)}`
        + ` A${R},${R} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${col}"
        stroke="var(--panel)" stroke-width="1"
        data-sn="${g.name}" data-sv="${g.total}" data-sp="${(frac * 100).toFixed(1)}"/>`;
    }
    // 名字直接标在扇区里（占比看 hover）。扇区放不下全名时按可用宽度截断，
    // 太小的扇区不标——可用宽度沿弧向和径向取加权和，朝侧向的窄扇区也能放短名。
    const mid = (a0 + a1) / 2;
    const arcW = frac * 2 * Math.PI * (R * 0.62);
    const avail = arcW * Math.abs(Math.sin(mid)) + R * 0.55 * Math.abs(Math.cos(mid));
    const maxChars = Math.floor(avail / 6.6);
    if (maxChars >= 4) {
      // 项目名区分度在结尾（infra-…-wiki-mcp），保留结尾；模型名保留开头
      const keepTail = id !== 'models';
      const name = g.name.length > maxChars
        ? (keepTail ? '…' + g.name.slice(-(maxChars - 1)) : g.name.slice(0, maxChars - 1) + '…')
        : g.name;
      const [lx, ly] = pt(mid, R * 0.62);
      labels += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" class="pie-label">${name}</text>`;
    }
  }

  box.innerHTML = `<div class="pie-wrap">
    <svg width="220" height="220" viewBox="0 0 220 220">${slices}${labels}</svg>
  </div>`;
}

/* ---------- tooltip ---------- */
const tip = document.getElementById('tip');
function clearColumn() {
  document.querySelectorAll('.cal i.col-hot').forEach(x => x.classList.remove('col-hot'));
}
function placeTip(anchor) {
  const r = anchor.getBoundingClientRect();
  tip.style.opacity = 1;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(window.innerWidth - tw - 8, r.left + r.width / 2 - tw / 2)) + 'px';
  // 贴近顶部时翻到下方，免得被裁掉
  tip.style.top = (r.top - th - 8 < 4 ? r.bottom + 8 : r.top - th - 8) + 'px';
}

document.addEventListener('mouseover', e => {
  // 顶部合计卡：显示统计窗口、缓存读、命中率（总 token 和次数已在卡片显示，不重复）
  const mc = e.target.closest('#metrics');
  if (mc) {
    tip.innerHTML = `<b>${mc.dataset.win}</b>`
      + `<br>cache read <b>${human(+mc.dataset.read)}</b>`
      + `<br>hit rate <b>${mc.dataset.hit}</b>`;
    placeTip(mc);
    return;
  }
  // 占比饼图的扇区：显示这个名字的总量和占比
  const arc = e.target.closest('.pie-wrap path, .pie-wrap circle');
  if (arc) {
    tip.innerHTML = `<b>${arc.dataset.sn}</b><br><b>${human(+arc.dataset.sv)}</b>`
      + `<span class="sm"> · ${arc.dataset.sp}%</span>`;
    placeTip(arc);
    return;
  }
  // 按模型品牌条：显示该模型总量和占窗口比例
  const mbar = e.target.closest('.mbar');
  if (mbar) {
    tip.innerHTML = `<b>${mbar.dataset.sn}</b><br><b>${human(+mbar.dataset.sv)}</b>`
      + `<span class="sm"> · ${mbar.dataset.sp}%</span>`;
    placeTip(mbar);
    return;
  }
  // 堆叠条的某一段：显示这个项目里该模型的具体用量
  const seg = e.target.closest('.stack span');
  if (seg) {
    tip.innerHTML = `<b>${seg.dataset.sn}</b><br>${seg.dataset.seg} `
      + `<b>${human(+seg.dataset.sv)}</b><span class="sm"> · ${seg.dataset.sp}%</span>`;
    placeTip(seg);
    return;
  }
  const cell = e.target.closest('.cal i');
  if (!cell) return;
  // 格子可能来自主屏或长区间遮罩，各自跟随自己的 view 状态
  const cview = cell.closest('#longview') ? lvState.view : state.view;
  const unit = cview === 'weekly' ? 'calls (whole week)' : 'calls';
  // 累计视图 hover 显示截至当日的累计值（格子着色仍是当日增量）
  const cum = cview === 'cumulative' && cell.dataset.cum
    ? ` · cumulative <b>${human(+cell.dataset.cum)}</b>` : '';
  // token 用 K/M/B，调用次数保持整数——次数本来就是个位数量级的计数
  tip.innerHTML = cell.dataset.v
    ? `<b>${cell.dataset.d}</b> · ${cell.dataset.p}<br>incr <b>${human(+cell.dataset.i)}</b>${cum}`
      + `<br><span class="sm">cache read ${human(+cell.dataset.c)} · ${fmt(+cell.dataset.m)} ${unit}</span>`
    : `<b>${cell.dataset.d}</b> · ${cell.dataset.p}<br><span class="sm">no activity${cum}</span>`;

  // 每周模式下整列同属一周，一起高亮才看得出 hover 的是哪一周
  clearColumn();
  if (cview === 'weekly') {
    cell.closest('.cal').querySelectorAll(`i[data-col="${cell.dataset.col}"]`)
        .forEach(x => x.classList.add('col-hot'));
  }

  placeTip(cell);
});
document.addEventListener('mouseout', e => {
  if (!e.target.closest('#metrics') && !e.target.closest('.cal i') && !e.target.closest('.stack span')
      && !e.target.closest('.mbar') && !e.target.closest('.pie-wrap')) return;
  tip.style.opacity = 0;
  clearColumn();
});

/* ---------- 渲染 ---------- */
function render() {
  // 三个视图共用同一套格子行：每行一个平台，标题带窗口数字，图例/额度并进标题右端。
  // 累计视图的区别只在 tooltip（hover 显示截至当日的累计值），格子着色不变。
  renderCalendar('view', state.view, state.weeks);
}

function renderRanks() {
  renderRank('models', DATA.models, 'model');
  renderRank('projects', DATA.projects, 'project');
}

function renderAll() {
  renderMeta();
  render();
  renderRanks();
  // 长区间遮罩开着的话跟着刷新
  if (!document.getElementById('longview').hidden) renderLongview();
}

function bindSeg(id, key, cast) {
  document.getElementById(id).addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    state[key] = cast(btn.dataset[key === 'weeks' ? 'weeks' : 'view']);
    [...btn.parentNode.children].forEach(b => b.setAttribute('aria-pressed', b === btn));
    render();
    // 时间窗口变了，右侧卡片和排行都要跟着重算
    renderMeta();
    renderRanks();
  });
}

bindSeg('view-seg', 'view', String);

/* ---------- 长区间遮罩 ----------
   主屏只放 3 个月；半年/一年在这里用整个屏幕渲染，Esc 或 ✕ 关闭。 */
const lv = document.getElementById('longview');
function renderLongview() {
  renderCalendar('lv-view', lvState.view, lvState.weeks);
}
document.getElementById('longview-btn').addEventListener('click', () => {
  lv.hidden = false;
  renderLongview();
});
document.getElementById('lv-close').addEventListener('click', () => { lv.hidden = true; });
for (const [id, key, cast] of [['lv-view-seg', 'view', String], ['lv-range-seg', 'weeks', Number]]) {
  document.getElementById(id).addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    lvState[key] = cast(btn.dataset[key]);
    [...btn.parentNode.children].forEach(b => b.setAttribute('aria-pressed', b === btn));
    renderLongview();
  });
}

// 排行面板的 列表/占比 切换：只影响本面板，不动时间窗口
for (const id of ['models', 'projects']) {
  document.getElementById(id + '-toggle').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    rankMode[id] = btn.dataset.mode;
    [...btn.parentNode.children].forEach(b => b.setAttribute('aria-pressed', b === btn));
    renderRanks();
  });
}

applyData(DATA);
renderAll();

/* ---------- 口径说明 ---------- */

info.innerHTML = `
  <div><b>Caliber</b>: incremental tokens = non-cached input + output + cache write. cache_read is listed separately and not used for coloring — it's over 90% of the total and would make the chart only reflect session length.</div>
  <div><b>Cross-tool alignment</b>: Grok's <code>inputTokens</code> includes cache reads, Claude's <code>input_tokens</code> doesn't; this is subtracted at collection time.</div>
  <div><b>Dedup</b>: Claude by <code>message.id</code> (streaming writes repeat), Grok by <code>session+prompt_id+model</code> (naturally unique).</div>
  <div><b>Timezone</b>: Claude's UTC strings and Grok's unix seconds are both converted to local time.</div>
  <div><b>Cost</b>: only Grok records <code>costUsdTicks</code>, estimated at 1e-9 USD and nominal under a subscription — not actual billing.</div>
  <div><b>Quota area</b>: below each grid, single row. The plan's 5-hour and weekly window usage, independent of the time window. cco / ccs / grok / kimi are polled every 3 min (serve mode only; on failure the last successful data is shown). Codex's <code>rate_limits</code> rides along in its session files — read locally, no network.</div>
  <div><b>Cumulative view</b>: cells are still colored by that day's increment (cumulative is monotonic, coloring carries no information); hover a cell for the cumulative value up to that day.</div>

document.addEventListener('click', e => {

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { info.hidden = true; lv.hidden = true; }
});

/* ---------- 每分钟自动同步 ----------
   服务端后台线程按自己的节奏重扫，这里只是把结果取回来。数据没变化时
   不重绘，免得整点把正在 hover 的格子刷掉。 */
let lastSync = Date.now();
const signature = p => JSON.stringify([
  p.profiles.map(x => [x.key, x.incr, x.msgs]), p.daily.length
]);
let lastSig = signature(DATA);

async function autoSync() {
  try {
    const res = await fetch('/api/data', { cache: 'no-store' });
    if (!res.ok) return;                 // 静态模式下静默跳过，不打扰
    const payload = await res.json();
    lastSync = Date.now();
    const sig = signature(payload);
    if (sig === lastSig) return;         // 无变化就不动 DOM
    lastSig = sig;
    applyData(payload);
    renderAll();
  } catch (err) { /* 离线打开时必然失败，忽略 */ }
}

function tickSync() {
  const sec = Math.round((Date.now() - lastSync) / 1000);
  document.getElementById('sync').innerHTML =
    sec < 90 ? `updated <b>${sec}</b>s ago` : `updated <b>${Math.round(sec / 60)}</b>m ago`;
}
setInterval(autoSync, 60000);
setInterval(tickSync, 1000);
tickSync();

/* ---------- 刷新 ----------
   有本地服务时 /api/data 会重新扫描目录并返回新聚合结果；
   直接双击 file:// 打开时 fetch 必然失败，降级成给出命令。 */
const REFRESH_CMD = 'python3 collect.py --serve';
const btn = document.getElementById('refresh');
const btnText = document.getElementById('refresh-text');
let busy = false, resetTimer = null;

function flash(cls, text, ms) {
  btn.classList.add(cls);
  btnText.textContent = text;
  clearTimeout(resetTimer);
  resetTimer = setTimeout(() => {
    btn.classList.remove('ok', 'warn');
    btnText.textContent = 'Refresh';
  }, ms);
}

async function doRefresh() {
  if (busy) return;
  busy = true;
  btn.disabled = true;
  btn.classList.add('spin');
  btn.classList.remove('ok', 'warn');
  btnText.textContent = 'Scanning';
  try {
    // force=1 让服务端立刻重扫，不等下一个定时周期
    const res = await fetch('/api/data?force=1', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    applyData(await res.json());
    renderAll();
    lastSync = Date.now();
    flash('ok', 'Updated', 2000);
  } catch (err) {
    info.hidden = false;
    flash('warn', 'Need server', 3600);
  } finally {
    busy = false;
    btn.disabled = false;
    btn.classList.remove('spin');
  }
}

btn.addEventListener('click', doRefresh);
// r 键刷新，但别抢输入框的按键
document.addEventListener('keydown', e => {
  if (e.key === 'r' && !e.metaKey && !e.ctrlKey && !e.altKey
      && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) doRefresh();
});

// 窗口尺寸变了要重算格子与行数，否则不再刚好一屏
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderAll, 150);
});
</script>
</body>
