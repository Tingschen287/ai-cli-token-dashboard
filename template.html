<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Dashboard</title>
<!-- 图标就是热力图本身：Claude 橙底 + 深浅白格。内联 SVG，不引外部资源；
     16px 下格子仍分得清，比通用图表 emoji 更认得出是这个看板 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3.6' fill='%23d97757'/><g fill='%23fff'><rect x='2.3' y='3.8' width='2.4' height='2.4' rx='.6' opacity='.30'/><rect x='5.3' y='3.8' width='2.4' height='2.4' rx='.6' opacity='.95'/><rect x='8.3' y='3.8' width='2.4' height='2.4' rx='.6' opacity='.55'/><rect x='11.3' y='3.8' width='2.4' height='2.4' rx='.6' opacity='.25'/><rect x='2.3' y='6.8' width='2.4' height='2.4' rx='.6' opacity='.50'/><rect x='5.3' y='6.8' width='2.4' height='2.4' rx='.6' opacity='.75'/><rect x='8.3' y='6.8' width='2.4' height='2.4' rx='.6' opacity='1'/><rect x='11.3' y='6.8' width='2.4' height='2.4' rx='.6' opacity='.40'/><rect x='2.3' y='9.8' width='2.4' height='2.4' rx='.6' opacity='.25'/><rect x='5.3' y='9.8' width='2.4' height='2.4' rx='.6' opacity='.45'/><rect x='8.3' y='9.8' width='2.4' height='2.4' rx='.6' opacity='.70'/><rect x='11.3' y='9.8' width='2.4' height='2.4' rx='.6' opacity='.90'/></g></svg>">
<style>
/*__STYLE__*/
</style>
</head>

<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-title">
      <h1>Token Activity</h1>
      <button class="btn cp-trigger" id="coding-plan-btn" aria-haspopup="dialog" aria-controls="coding-plan-dialog">
        Coding Plan <span class="cp-alert-dot" hidden></span>
      </button>
    </div>
    <!-- 三列网格：标题靠左、全期总账压正中、其余靠右。左右两列都是 1fr，
         中间列才真的落在顶栏中线上（换成 flex + spacer 只能居中于剩余空间） -->
    <span class="total" id="total"></span>
    <div class="topbar-right">
      <!-- VPS 带宽胶囊：没配 vps.local.json 时整块不出现（JS 里保持 hidden）。
           点开是每日分账号的柱状图，见 vps.js -->
      <button class="vps-pill" id="vps-btn" hidden aria-expanded="false">
        <svg class="vps-ring" viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
          <circle cx="10" cy="10" r="8" fill="none" stroke="var(--empty)" stroke-width="3.4"/>
          <circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="3.4"
                  stroke-linecap="round" transform="rotate(-90 10 10)"
                  id="vps-ring-arc" stroke-dasharray="0 999"/>
        </svg>
        <span id="vps-pill-text"></span>
      </button>
      <!-- 距上次同步多久，直接长在刷新按钮里：平时只有倒计时，
           点下去才临时换成 Scanning / Updated 之类的状态字 -->
      <button class="btn" id="refresh" data-tip="点击立即重新扫描（快捷键 r）">
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
          <path d="M13.6 8a5.6 5.6 0 1 1-1.7-4" fill="none" stroke="currentColor"
                stroke-width="1.7" stroke-linecap="round"/>
          <path d="M13.4 1.2v3.1h-3.1" fill="none" stroke="currentColor"
                stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="refresh-text"></span>
      </button>
      <button class="btn" id="layout-btn" data-tip="编辑布局：点 − 移除到候补池，拖动换位，拖分隔条调占比">Layout</button>
      <button class="btn icon" id="info-btn" aria-label="Methodology" data-tip="Methodology">ⓘ</button>
    </div>
  </header>

  <div class="stage">
    <section class="panel">
      <div class="panel-head">
        <div class="seg" id="view-seg">
          <button data-view="daily" aria-pressed="true">Daily</button>
          <button data-view="weekly" aria-pressed="false">Weekly</button>
          <button data-view="cumulative" aria-pressed="false">Cumulative</button>
        </div>
        <span class="note" id="scale-note"></span>
        <div class="metrics" id="metrics"></div>
        <button class="btn" id="longview-btn" data-tip="打开半年 / 一年长区间视图">6 mo / 1 yr ▸</button>
      </div>
      <div class="cal-wrap" id="view"></div>
    </section>

    <aside class="side">
      <!-- 性能卡：CPU/内存/GPU/磁盘四环，独立 2 秒轮询 /api/sys（sys.js），不随主屏刷新节奏 -->
      <section class="panel" id="sys-panel">
        <div class="panel-head">
          <h2>Performance</h2>
          <span class="note" id="sys-note"></span>
        </div>
        <div class="sys-grid" id="sys-grid"></div>
      </section>
      <!-- 排行板：Model | Project 顶层 tab 切换（两个榜同构，合并后独享 2/3 高度）；
           前 7 名 + Other 汇总条，下方放占比空心环（charts.js） -->
      <section class="panel rank-panel">
        <div class="panel-head">
          <div class="seg" id="rank-tab">
            <button data-tab="models" aria-pressed="true">Model</button>
            <button data-tab="projects" aria-pressed="false">Project</button>
          </div>
        </div>
        <div class="rank" id="rank"></div>
      </section>
    </aside>
  </div>

  <!-- 编辑态候补池：未上屏的来源组件，点击或拖入上屏；只在编辑布局时显示 -->
  <div id="pool" hidden></div>
</div>

<div id="tip"></div>
<div id="info" hidden></div>
<div id="vps-pop" hidden></div>

<dialog id="coding-plan-dialog" aria-labelledby="cp-title">
  <header class="cp-header">
    <div><p class="cp-eyebrow">CODING PLAN / API</p><h2 id="cp-title">部门额度</h2>
      <p class="cp-subtitle">个人编程套餐与 API 余额</p></div>
    <button class="btn icon" id="cp-close" aria-label="关闭部门额度">✕</button>
  </header>
  <div class="cp-toolbar">
    <span id="cp-summary" role="status">正在读取额度…</span>
    <div><span id="cp-updated"></span><button class="btn" id="cp-refresh">↻ 刷新额度</button></div>
  </div>
  <p id="cp-error" role="status" hidden></p>
  <div class="cp-grid" id="cp-grid"></div>
  <footer class="cp-footer"><span>进度条表示剩余额度 · 少于 20% 提醒 · 少于 10% 告急</span><span>每 3 分钟自动查询</span></footer>
</dialog>

<!-- 长区间全屏遮罩：主屏只放 3 个月，半年/一年在这里用整个屏幕的宽高画 -->
<div id="longview" hidden>
  <section class="panel lv-panel">
    <div class="panel-head">
      <div class="seg" id="lv-view-seg">
        <button data-view="daily" aria-pressed="true">Daily</button>
        <button data-view="weekly" aria-pressed="false">Weekly</button>
        <button data-view="cumulative" aria-pressed="false">Cumulative</button>
      </div>
      <div class="seg" id="lv-range-seg">
        <button data-weeks="26" aria-pressed="true">6 mo</button>
        <button data-weeks="53" aria-pressed="false">1 yr</button>
      </div>
      <button class="btn" id="lv-close" data-tip="关闭 (Esc)">✕</button>
    </div>
    <div class="cal-wrap" id="lv-view"></div>
  </section>
</div>

<script>
let DATA = /*__DATA__*/null;

/*__APP__*/
</script>
</body>
</html>
